# Render Blueprint for the Calibr API + Postgres (pgvector). The frontend runs on Vercel and reaches this API
# through its same-site /api rewrite (BACKEND_URL), so cookies stay first-party on the Vercel domain.
# Secrets marked `sync: false` are asked for once when the Blueprint is created. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: project-calibrate-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./deploy/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - deploy/**
        - render.yaml
      ignoredPaths:
        - backend/tests/**
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_MODE
        value: live
      - key: DATABASE_URL
        fromDatabase:
          name: project-calibrate-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIM
        value: "1536"
      - key: LLM_REASONING_EFFORT
        value: none
      - key: LLM_BUDGET_USD
        value: "3.00"
      - key: USER_DAILY_USD_CAP
        value: "0.50"
      - key: USER_HOURLY_REQUESTS
        value: "60"
      - key: MAX_CONCURRENT_RUNS_PER_USER
        value: "2"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_MODE
        value: quick # members enter a name (no password); the admin still signs in with a password
      - key: SIGNUP_MODE
        value: closed
      - key: PUBLIC_APP_URL
        value: https://project-calibrate.vercel.app
      - key: CORS_ORIGINS
        value: https://project-calibrate.vercel.app
      - key: USD_VND_RATE_DEFAULT
        value: "25869" # open.er-api.com, 2026-10-19; the admin can change it in Settings
      - key: FX_AUTO_UPDATE
        value: "true" # daily refresh from the public provider (non-blocking, falls back to the stored rate)
      - key: SEED_ARCHIVE
        value: "true"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: project-calibrate-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: calibr
    user: calibr
