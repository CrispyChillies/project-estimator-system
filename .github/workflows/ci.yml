name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: calibr, POSTGRES_PASSWORD: calibr, POSTGRES_DB: calibr }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U calibr" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q -p no:cacheprovider
        env:
          LLM_MODE: fake
          TEST_DATABASE_URL: postgresql+psycopg://calibr:calibr@localhost:5432/calibr_test
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm exec tsc --noEmit
      - run: pnpm build
      - run: node ../scripts/check_no_demo_strings.mjs
