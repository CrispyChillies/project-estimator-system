services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: calibr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calibr}
      POSTGRES_DB: calibr
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calibr -d calibr"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://calibr:${POSTGRES_PASSWORD:-calibr}@db:5432/calibr
      FIXTURES_DIR: /data/fixtures
      RAW_DATA_DIR: /data/raw
      UPLOAD_DIR: /uploads
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - uploads:/uploads
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
