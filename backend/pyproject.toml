[project]
name = "calibr-backend"
version = "0.1.0"
description = "Calibr: self-learning software project estimator (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "numpy>=2.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
